spring:
  application:
    name: matchgraph-api
  data:
    redis:
      host: ${MATCHGRAPH_REDIS_HOST:localhost}
      port: ${MATCHGRAPH_REDIS_PORT:6379}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${MATCHGRAPH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jooq:
    sql-dialect: postgres

matchgraph:
  kafka:
    bootstrap-servers: ${MATCHGRAPH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  clickhouse:
    url: ${MATCHGRAPH_CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/matchgraph}
  redis:
    host: ${MATCHGRAPH_REDIS_HOST:localhost}
    port: ${MATCHGRAPH_REDIS_PORT:6379}

management:
  endpoint:
    health:
      probes:
        enabled: true
